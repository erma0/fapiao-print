version: "3.8"

services:
  ticketchan:
    build: .
    container_name: ticketchan-web
    ports:
      - "3000:3000"
    environment:
      - TICKETCHAN_SERVER_PORT=3000
      - TICKETCHAN_SESSION_DIR=/tmp/ticketchan
      - TICKETCHAN_FRONTEND_DIR=/app/frontend
      - TICKETCHAN_AUTH_TOKEN=${AUTH_TOKEN:-}
      - RUST_LOG=info
    volumes:
      - ticketchan-sessions:/tmp/ticketchan
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: ticketchan-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ticketchan
    restart: unless-stopped
    profiles:
      - production

volumes:
  ticketchan-sessions:
