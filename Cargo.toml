[package]
name = "ticketchan"
version = "2.1.0"
description = "发票酱 — Web 版"
authors = ["ticketchan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
ocr = ["ocr-rs"]

[lib]
name = "app_lib"
crate-type = ["rlib"]

[[bin]]
name = "ticketchan-server"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico", "bmp", "tiff", "webp"] }
ab_glyph = "0.2"
printpdf = { version = "0.9", features = ["images"] }
lopdf = "0.39"
encoding_rs = "0.8"
rayon = "1.10"
kamadak-exif = "0.5"
ocr-rs = { version = "2.2", optional = true }
invoice-engine = { path = "invoice-engine" }
flate2 = "1.1.9"
tar = "0.4"
zip = "2"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
libloading = "0.8"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "catch-panic", "fs"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
open = "5"
dashmap = "6"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_Storage_Xps_Printing",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
